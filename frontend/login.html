<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Linked Jobs Route Planner Login</title>
    <style>
      :root {
        color-scheme: light;
        --bg: #f3efe4;
        --panel: rgba(255, 255, 255, 0.78);
        --panel-border: rgba(30, 41, 59, 0.12);
        --ink: #102133;
        --muted: #526173;
        --accent: #0f766e;
        --accent-strong: #115e59;
      }
      * { box-sizing: border-box; }
      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        font-family: Arial, Helvetica, sans-serif;
        background:
          radial-gradient(circle at top left, rgba(15, 118, 110, 0.14), transparent 35%),
          radial-gradient(circle at bottom right, rgba(17, 94, 89, 0.12), transparent 30%),
          linear-gradient(180deg, #faf7f0, var(--bg));
        color: var(--ink);
        padding: 24px;
      }
      .card {
        width: min(560px, 100%);
        padding: 32px;
        border-radius: 28px;
        background: var(--panel);
        border: 1px solid var(--panel-border);
        box-shadow: 0 24px 80px rgba(16, 33, 51, 0.14);
        backdrop-filter: blur(18px);
      }
      h1 { margin: 0 0 12px; font-size: 2rem; }
      p { color: var(--muted); line-height: 1.5; }
      form { display: grid; gap: 14px; margin-top: 24px; }
      label { display: grid; gap: 8px; font-weight: 700; }
      input {
        width: 100%;
        border: 1px solid rgba(16, 33, 51, 0.16);
        border-radius: 14px;
        padding: 14px 16px;
        font: inherit;
        background: rgba(255, 255, 255, 0.9);
      }
      button {
        margin-top: 8px;
        border: 0;
        border-radius: 999px;
        padding: 14px 18px;
        font: inherit;
        font-weight: 700;
        color: white;
        background: linear-gradient(135deg, var(--accent), var(--accent-strong));
        cursor: pointer;
      }
      .message {
        min-height: 1.2em;
        color: #9b1c1c;
        font-weight: 700;
      }
      .meta {
        margin-top: 18px;
        font-size: 0.95rem;
      }
    </style>
  </head>
  <body>
    <main class="card">
      <p class="eyebrow">Local route planner</p>
      <h1>Sign in to your dashboard</h1>
      <p>
        This login keeps a 7-day session for the route-planner app. Live job data still comes from
        the signed-in browser tab or extension, so the dashboard does not need the browser session
        to stay open.
      </p>
      <div class="message">%%MESSAGE%%</div>
      <form method="post" action="/auth/login">
        <label>
          Username
          <input name="username" autocomplete="username" value="kyle" />
        </label>
        <label>
          Password
          <input name="password" type="password" autocomplete="current-password" value="taylor" />
        </label>
        <button type="submit">Enter dashboard</button>
      </form>
      <p class="meta">Default local credentials: <strong>kyle</strong> / <strong>taylor</strong></p>
    </main>
  </body>
</html>
